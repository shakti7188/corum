<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fafbfc"/><stop offset="100%" stop-color="#eef0f4"/></linearGradient>
    <radialGradient id="wash" cx="0%" cy="40%" r="80%"><stop offset="0%" stop-color="#16a34a" stop-opacity="0.10"/><stop offset="60%" stop-color="#16a34a" stop-opacity="0.02"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16a34a" stop-opacity="0.28"/><stop offset="100%" stop-color="#16a34a" stop-opacity="0"/></linearGradient>
    <linearGradient id="av1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="av2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f2bf22"/><stop offset="100%" stop-color="#da9e49"/></linearGradient>
    <linearGradient id="av3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#wash)"/>

  <!-- Frame -->
  <rect x="32" y="32" width="1136" height="836" rx="20" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <rect x="32" y="32" width="1136" height="60" rx="20" fill="#f7f8fa"/>
  <rect x="32" y="80" width="1136" height="12" fill="#f7f8fa"/>
  <circle cx="60" cy="62" r="6" fill="#ef4444"/><circle cx="80" cy="62" r="6" fill="#f2bf22"/><circle cx="100" cy="62" r="6" fill="#22c55e"/>
  <text x="138" y="68" font-size="15" font-weight="600" fill="#0a0a0a">Bidding · LTV-weighted optimisation</text>

  <!-- Toggle / status row -->
  <g transform="translate(64,124)">
    <rect width="1072" height="56" rx="14" fill="#dcfce7" stroke="#22c55e"/>
    <circle cx="32" cy="28" r="6" fill="#22c55e"/>
    <text x="50" y="34" font-size="13" font-weight="600" fill="#0a0a0a">Auto-rebalance · ON</text>
    <text x="232" y="34" font-size="12" fill="#374151">marginal-ROAS &gt; 4.0 → scale; &lt; 2.5 → trim</text>
    <text x="908" y="34" font-size="12" fill="#6b7280">last update · 6 min ago</text>
  </g>

  <!-- Marginal ROAS curve -->
  <g transform="translate(64,210)">
    <rect width="700" height="448" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14" font-weight="600" fill="#0a0a0a">Marginal ROAS curve · last 12 weeks</text>
    <text x="24" y="56" font-size="12" fill="#6b7280">Where the next dollar earns its keep</text>

    <g stroke="#f3f4f6" stroke-dasharray="3,4">
      <line x1="80" y1="120" x2="676" y2="120"/>
      <line x1="80" y1="200" x2="676" y2="200"/>
      <line x1="80" y1="280" x2="676" y2="280"/>
      <line x1="80" y1="360" x2="676" y2="360"/>
    </g>
    <g font-size="10" fill="#9ca3af">
      <text x="64" y="124" text-anchor="end">8.0×</text>
      <text x="64" y="204" text-anchor="end">6.0×</text>
      <text x="64" y="284" text-anchor="end">4.0×</text>
      <text x="64" y="364" text-anchor="end">2.0×</text>
    </g>
    <rect x="80" y="248" width="596" height="64" fill="#fef3c7"/>
    <line x1="80" y1="248" x2="676" y2="248" stroke="#f2bf22" stroke-dasharray="2,4"/>
    <text x="676" y="244" font-size="10" fill="#b8860b" text-anchor="end">target ROAS 4.0×</text>

    <path d="M80 110 Q200 130 280 180 Q360 230 460 280 Q560 320 676 380 L676 388 L80 388 Z" fill="url(#curveFill)"/>
    <path d="M80 110 Q200 130 280 180 Q360 230 460 280 Q560 320 676 380" fill="none" stroke="#16a34a" stroke-width="2.6"/>

    <g>
      <line x1="280" y1="120" x2="280" y2="388" stroke="#d1d5db" stroke-dasharray="3,4"/>
      <line x1="460" y1="120" x2="460" y2="388" stroke="#d1d5db" stroke-dasharray="3,4"/>
      <text x="180" y="408" font-size="10" fill="#16a34a" text-anchor="middle">SCALE-UP</text>
      <text x="370" y="408" font-size="10" fill="#b8860b" text-anchor="middle">HOLD</text>
      <text x="568" y="408" font-size="10" fill="#dc2626" text-anchor="middle">TRIM</text>
    </g>

    <circle cx="370" cy="245" r="8" fill="#f2bf22" stroke="#fff" stroke-width="2"/>
    <rect x="290" y="170" width="180" height="56" rx="10" fill="#fef3c7" stroke="#f2bf22"/>
    <text x="306" y="190" font-size="11" fill="#78350f">Current operating point</text>
    <text x="306" y="210" font-size="14" font-weight="700" fill="#b8860b">$1.42M · 4.7× ROAS</text>
    <line x1="370" y1="226" x2="370" y2="245" stroke="#f2bf22" stroke-width="1.4"/>

    <text x="80" y="424" font-size="10" fill="#9ca3af">$0</text>
    <text x="280" y="424" font-size="10" fill="#9ca3af">$0.8M</text>
    <text x="460" y="424" font-size="10" fill="#9ca3af">$1.6M</text>
    <text x="676" y="424" font-size="10" fill="#9ca3af" text-anchor="end">$2.4M</text>
  </g>

  <!-- Right column: Tier brackets, with avatar groups -->
  <g transform="translate(796,210)">
    <rect width="340" height="448" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="14" font-weight="600" fill="#0a0a0a">Audience layering</text>
    <text x="24" y="54" font-size="12" fill="#6b7280">Per-cohort bid ceilings</text>

    <!-- Cold -->
    <g transform="translate(24,80)">
      <rect width="292" height="100" rx="12" fill="#ffffff" stroke="#60a5fa"/>
      <text x="16" y="28" font-size="11" letter-spacing="1.6" fill="#1d4ed8">COLD</text>
      <text x="16" y="56" font-size="20" font-weight="700" fill="#0a0a0a">tCPA $42</text>
      <text x="16" y="80" font-size="11" fill="#6b7280">value-based · LTV proxy</text>
      <g transform="translate(208,30)">
        <circle cx="10" cy="20" r="11" fill="url(#av1)" stroke="#fff" stroke-width="2"/>
        <circle cx="26" cy="20" r="11" fill="#dbeafe" stroke="#fff" stroke-width="2"/>
        <circle cx="42" cy="20" r="11" fill="#bfdbfe" stroke="#fff" stroke-width="2"/>
        <text x="68" y="25" font-size="14" font-weight="700" fill="#1d4ed8">42%</text>
      </g>
    </g>

    <!-- Warm -->
    <g transform="translate(24,196)">
      <rect width="292" height="100" rx="12" fill="#ffffff" stroke="#f2bf22"/>
      <text x="16" y="28" font-size="11" letter-spacing="1.6" fill="#b8860b">WARM</text>
      <text x="16" y="56" font-size="20" font-weight="700" fill="#0a0a0a">tROAS 4.2×</text>
      <text x="16" y="80" font-size="11" fill="#6b7280">site visit + 7d window</text>
      <g transform="translate(208,30)">
        <circle cx="10" cy="20" r="11" fill="url(#av2)" stroke="#fff" stroke-width="2"/>
        <circle cx="26" cy="20" r="11" fill="#fef3c7" stroke="#fff" stroke-width="2"/>
        <circle cx="42" cy="20" r="11" fill="#fde68a" stroke="#fff" stroke-width="2"/>
        <text x="68" y="25" font-size="14" font-weight="700" fill="#b8860b">38%</text>
      </g>
    </g>

    <!-- Retargeting -->
    <g transform="translate(24,312)">
      <rect width="292" height="100" rx="12" fill="#ffffff" stroke="#22c55e"/>
      <text x="16" y="28" font-size="11" letter-spacing="1.6" fill="#15803d">RETARGETING</text>
      <text x="16" y="56" font-size="20" font-weight="700" fill="#0a0a0a">tROAS 8.1×</text>
      <text x="16" y="80" font-size="11" fill="#6b7280">cart + checkout abandon</text>
      <g transform="translate(208,30)">
        <circle cx="10" cy="20" r="11" fill="url(#av3)" stroke="#fff" stroke-width="2"/>
        <circle cx="26" cy="20" r="11" fill="#dcfce7" stroke="#fff" stroke-width="2"/>
        <text x="52" y="25" font-size="14" font-weight="700" fill="#15803d">20%</text>
      </g>
    </g>
  </g>

  <!-- bottom result strip -->
  <g transform="translate(64,690)">
    <rect width="1072" height="148" rx="14" fill="#dcfce7" stroke="#22c55e" filter="url(#shadow)"/>
    <text x="24" y="36" font-size="11" letter-spacing="2.4" fill="#15803d">SHIFT FROM SIGNUPS → REVENUE-WEIGHTED</text>
    <g transform="translate(24,58)">
      <text font-size="32" font-weight="700" fill="#0a0a0a">2.7×</text>
      <text x="0" y="24" font-size="12" fill="#374151">avg ROAS lift on cohorts</text>
      <text x="0" y="46" font-size="11" fill="#6b7280">across last 14 active programs</text>
    </g>
    <g transform="translate(280,58)">
      <text font-size="32" font-weight="700" fill="#0a0a0a">−38%</text>
      <text x="0" y="24" font-size="12" fill="#374151">budget on losing creatives</text>
      <text x="0" y="46" font-size="11" fill="#6b7280">marginal-spend audit, weekly</text>
    </g>
    <g transform="translate(548,58)">
      <text font-size="32" font-weight="700" fill="#0a0a0a">+24%</text>
      <text x="0" y="24" font-size="12" fill="#374151">scale on top quartile</text>
      <text x="0" y="46" font-size="11" fill="#6b7280">when marginal &gt; 4.0× sustained</text>
    </g>
    <g transform="translate(816,58)">
      <text font-size="32" font-weight="700" fill="#b8860b">PASS</text>
      <text x="0" y="24" font-size="12" fill="#374151">target tROAS hit · 11/14 wks</text>
      <text x="0" y="46" font-size="11" fill="#6b7280">3 weeks held flat — incrementality test</text>
    </g>
  </g>
</svg>
