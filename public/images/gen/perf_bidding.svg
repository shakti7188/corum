<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0b10"/><stop offset="100%" stop-color="#10121b"/></linearGradient>
    <radialGradient id="wash" cx="0%" cy="40%" r="80%"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/><stop offset="60%" stop-color="#22c55e" stop-opacity="0.02"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.32"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#wash)"/>

  <!-- Frame -->
  <rect x="32" y="32" width="1136" height="836" rx="20" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="32" y="32" width="1136" height="60" rx="20" fill="rgba(255,255,255,0.03)"/>
  <rect x="32" y="80" width="1136" height="12" fill="rgba(255,255,255,0.03)"/>
  <circle cx="60" cy="62" r="6" fill="#ef4444"/><circle cx="80" cy="62" r="6" fill="#f2bf22"/><circle cx="100" cy="62" r="6" fill="#22c55e"/>
  <text x="138" y="68" font-size="15" font-weight="600" fill="#fff">Bidding · LTV-weighted optimisation</text>

  <!-- Toggle / status row -->
  <g transform="translate(64,124)">
    <rect width="1072" height="56" rx="14" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.38)"/>
    <circle cx="32" cy="28" r="6" fill="#22c55e"/>
    <text x="50" y="34" font-size="13" font-weight="600" fill="#fff">Auto-rebalance · ON</text>
    <text x="232" y="34" font-size="12" fill="rgba(255,255,255,0.55)">marginal-ROAS &gt; 4.0 → scale; &lt; 2.5 → trim</text>
    <text x="908" y="34" font-size="12" fill="rgba(255,255,255,0.55)">last update · 6 min ago</text>
  </g>

  <!-- Marginal ROAS curve -->
  <g transform="translate(64,210)">
    <rect width="700" height="448" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="34" font-size="14" font-weight="600" fill="#fff">Marginal ROAS curve · last 12 weeks</text>
    <text x="24" y="56" font-size="12" fill="rgba(255,255,255,0.45)">Where the next dollar earns its keep</text>

    <!-- gridlines -->
    <g stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,4">
      <line x1="80" y1="120" x2="676" y2="120"/>
      <line x1="80" y1="200" x2="676" y2="200"/>
      <line x1="80" y1="280" x2="676" y2="280"/>
      <line x1="80" y1="360" x2="676" y2="360"/>
    </g>
    <!-- y axis labels -->
    <g font-size="10" fill="rgba(255,255,255,0.4)">
      <text x="64" y="124" text-anchor="end">8.0×</text>
      <text x="64" y="204" text-anchor="end">6.0×</text>
      <text x="64" y="284" text-anchor="end">4.0×</text>
      <text x="64" y="364" text-anchor="end">2.0×</text>
    </g>
    <!-- target band -->
    <rect x="80" y="248" width="596" height="64" fill="rgba(242,191,34,0.06)"/>
    <line x1="80" y1="248" x2="676" y2="248" stroke="rgba(242,191,34,0.5)" stroke-dasharray="2,4"/>
    <text x="676" y="244" font-size="10" fill="#f2bf22" text-anchor="end">target ROAS 4.0×</text>

    <!-- Curve (marginal ROAS — high at low spend, falls as spend rises) -->
    <path d="M80 110 Q200 130 280 180 Q360 230 460 280 Q560 320 676 380 L676 388 L80 388 Z" fill="url(#curveFill)"/>
    <path d="M80 110 Q200 130 280 180 Q360 230 460 280 Q560 320 676 380" fill="none" stroke="#22c55e" stroke-width="2.6"/>

    <!-- Spend brackets -->
    <g>
      <line x1="280" y1="120" x2="280" y2="388" stroke="rgba(255,255,255,0.18)" stroke-dasharray="3,4"/>
      <line x1="460" y1="120" x2="460" y2="388" stroke="rgba(255,255,255,0.18)" stroke-dasharray="3,4"/>
      <text x="180" y="408" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">SCALE-UP</text>
      <text x="370" y="408" font-size="10" fill="#f2bf22" text-anchor="middle">HOLD</text>
      <text x="568" y="408" font-size="10" fill="rgba(239,68,68,0.85)" text-anchor="middle">TRIM</text>
    </g>

    <!-- Operating point dot -->
    <circle cx="370" cy="245" r="8" fill="#f2bf22" stroke="#0a0b10" stroke-width="2"/>
    <rect x="290" y="170" width="180" height="56" rx="10" fill="rgba(242,191,34,0.12)" stroke="rgba(242,191,34,0.5)"/>
    <text x="306" y="190" font-size="11" fill="rgba(255,255,255,0.7)">Current operating point</text>
    <text x="306" y="210" font-size="14" font-weight="700" fill="#f2bf22">$1.42M · 4.7× ROAS</text>
    <line x1="370" y1="226" x2="370" y2="245" stroke="rgba(242,191,34,0.55)" stroke-width="1.4"/>

    <!-- x axis -->
    <text x="80" y="424" font-size="10" fill="rgba(255,255,255,0.4)">$0</text>
    <text x="280" y="424" font-size="10" fill="rgba(255,255,255,0.4)">$0.8M</text>
    <text x="460" y="424" font-size="10" fill="rgba(255,255,255,0.4)">$1.6M</text>
    <text x="676" y="424" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="end">$2.4M</text>
  </g>

  <!-- Right column: Tier brackets -->
  <g transform="translate(796,210)">
    <rect width="340" height="448" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="34" font-size="14" font-weight="600" fill="#fff">Audience layering</text>
    <text x="24" y="54" font-size="12" fill="rgba(255,255,255,0.45)">Per-cohort bid ceilings</text>

    <!-- Cold -->
    <g transform="translate(24,80)">
      <rect width="292" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(96,165,250,0.4)"/>
      <text x="16" y="28" font-size="11" letter-spacing="1.6" fill="#60a5fa">COLD</text>
      <text x="16" y="56" font-size="20" font-weight="700" fill="#fff">tCPA $42</text>
      <text x="16" y="80" font-size="11" fill="rgba(255,255,255,0.5)">value-based · LTV proxy</text>
      <rect x="240" y="38" width="40" height="40" rx="8" fill="rgba(96,165,250,0.16)"/>
      <text x="260" y="62" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">42%</text>
    </g>

    <!-- Warm -->
    <g transform="translate(24,196)">
      <rect width="292" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(242,191,34,0.5)"/>
      <text x="16" y="28" font-size="11" letter-spacing="1.6" fill="#f2bf22">WARM</text>
      <text x="16" y="56" font-size="20" font-weight="700" fill="#fff">tROAS 4.2×</text>
      <text x="16" y="80" font-size="11" fill="rgba(255,255,255,0.5)">site visit + 7d window</text>
      <rect x="240" y="38" width="40" height="40" rx="8" fill="rgba(242,191,34,0.16)"/>
      <text x="260" y="62" font-size="14" font-weight="700" fill="#f2bf22" text-anchor="middle">38%</text>
    </g>

    <!-- Retargeting -->
    <g transform="translate(24,312)">
      <rect width="292" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.5)"/>
      <text x="16" y="28" font-size="11" letter-spacing="1.6" fill="#22c55e">RETARGETING</text>
      <text x="16" y="56" font-size="20" font-weight="700" fill="#fff">tROAS 8.1×</text>
      <text x="16" y="80" font-size="11" fill="rgba(255,255,255,0.5)">cart + checkout abandon</text>
      <rect x="240" y="38" width="40" height="40" rx="8" fill="rgba(34,197,94,0.16)"/>
      <text x="260" y="62" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">20%</text>
    </g>
  </g>

  <!-- bottom result strip -->
  <g transform="translate(64,690)">
    <rect width="1072" height="148" rx="14" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.38)"/>
    <text x="24" y="36" font-size="11" letter-spacing="2.4" fill="#22c55e">SHIFT FROM SIGNUPS → REVENUE-WEIGHTED</text>
    <g transform="translate(24,58)">
      <text font-size="32" font-weight="700" fill="#fff">2.7×</text>
      <text x="0" y="24" font-size="12" fill="rgba(255,255,255,0.65)">avg ROAS lift on cohorts</text>
      <text x="0" y="46" font-size="11" fill="rgba(255,255,255,0.4)">across last 14 active programs</text>
    </g>
    <g transform="translate(280,58)">
      <text font-size="32" font-weight="700" fill="#fff">−38%</text>
      <text x="0" y="24" font-size="12" fill="rgba(255,255,255,0.65)">budget on losing creatives</text>
      <text x="0" y="46" font-size="11" fill="rgba(255,255,255,0.4)">marginal-spend audit, weekly</text>
    </g>
    <g transform="translate(548,58)">
      <text font-size="32" font-weight="700" fill="#fff">+24%</text>
      <text x="0" y="24" font-size="12" fill="rgba(255,255,255,0.65)">scale on top quartile</text>
      <text x="0" y="46" font-size="11" fill="rgba(255,255,255,0.4)">when marginal &gt; 4.0× sustained</text>
    </g>
    <g transform="translate(816,58)">
      <text font-size="32" font-weight="700" fill="#f2bf22">PASS</text>
      <text x="0" y="24" font-size="12" fill="rgba(255,255,255,0.65)">target tROAS hit · 11/14 wks</text>
      <text x="0" y="46" font-size="11" fill="rgba(255,255,255,0.4)">3 weeks held flat — incrementality test</text>
    </g>
  </g>
</svg>
